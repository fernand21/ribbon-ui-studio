name: One-time documentation link patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-docs-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Link homepage documentation to dedicated docs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')
          original = s
          s = s.replace('<a href="#docs">{t.nav[1]}</a>', '<a href={`${siteBase}/docs/`}>{t.nav[1]}</a>')
          s = s.replace('href="#manual"', 'href={`${siteBase}/docs/`}')
          if s == original:
              raise SystemExit('Expected documentation links were not found; no file was changed.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "site: link homepage to documentation"
          git push
