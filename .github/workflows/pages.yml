name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore full-resolution v4 screenshots
        run: |
          mkdir -p public/screenshots
          cat .image-src/v4/v4-create-installer-dialog/*.b64 | base64 -d > public/screenshots/v4-create-installer-dialog.png
          cat .image-src/v4/v4-office-icon-gallery/*.b64 | base64 -d > public/screenshots/v4-office-icon-gallery.png
          test "$(stat -c%s public/screenshots/v4-create-installer-dialog.png)" = "1772387"
          test "$(stat -c%s public/screenshots/v4-office-icon-gallery.png)" = "1714654"
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /ribbon-ui-studio
      - run: node scripts/export-pages.mjs
        env:
          NEXT_PUBLIC_BASE_PATH: /ribbon-ui-studio
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
